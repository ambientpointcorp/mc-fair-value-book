# Chapters 01, 03, 05 and 06 call get_treasury_yield_data(), so they need a
# FRED API key and a working connection to FRED. They are kept out of
# smoke-test.yaml deliberately: that workflow's badge should report only on
# deterministic offline checks, and an outage or rate-limit at FRED says
# nothing about the book's code.
#
# Without a FRED_API_KEY secret this skips rather than failing, so the
# workflow is harmless on a fork or a clone that has no key.
#
# The key is mapped into fred_api_key, the lowercase name dnsr's Sys.getenv()
# call reads. Nothing here prints it: the only thing read is whether it is
# non-empty. dnsr passes it to httr as a query parameter rather than building
# a URL string around it, logs only the series id, and reports failures as
# status codes, so it has no path into the log; Actions would mask it anyway.
name: fred-chapters

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  fred:
    name: run the FRED chapters
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # dnsr reads this exact lowercase name, via Sys.getenv("fred_api_key"),
      # so the secret is mapped to it rather than read directly. The value is
      # only ever tested for emptiness below; nothing here prints it, dnsr
      # passes it to httr as a query parameter rather than building a URL
      # string with it, and Actions masks a registered secret in the log if it
      # ever did appear.
      fred_api_key: ${{ secrets.FRED_API_KEY }}

    steps:
      # The secrets context cannot be read in a job-level `if`, so the presence
      # of the key becomes a step output that the rest of the job keys off.
      # This skips cleanly on a repository with no secret set, rather than
      # reporting an absent key as broken chapter code.
      - name: Is a FRED key available
        id: key
        run: |
          if [ -n "$fred_api_key" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No FRED_API_KEY secret is set, so chapters 01, 03, 05 and 06 were skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'

      - uses: r-lib/actions/setup-r@v2
        if: steps.key.outputs.present == 'true'
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.key.outputs.present == 'true'
        with:
          packages: |
            github::ambientpointcorp/dnsr
            github::ambientpointcorp/oasr
            any::KFAS
            any::dplyr
            any::ggplot2
            any::purrr
            any::tibble
            any::vars
            any::yuima
            any::zoo

      - name: Run chapters
        if: steps.key.outputs.present == 'true'
        run: |
          chapters=(
            01-term-structure.R
            03-dynamic-ns.R
            05-yuima.R
            06-yield-evolution.R
          )
          mkdir -p logs
          failed=()
          echo "| chapter | result | seconds |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for f in "${chapters[@]}"; do
            echo "::group::$f"
            start=$SECONDS
            if Rscript "$f" > "logs/${f%.R}.log" 2>&1; then
              result=pass
            else
              result=FAIL
              failed+=("$f")
            fi
            dur=$(( SECONDS - start ))
            tail -40 "logs/${f%.R}.log"
            echo "::endgroup::"
            echo "$f $result ${dur}s"
            echo "| \`$f\` | $result | $dur |" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "chapters that failed: ${failed[*]}"
            exit 1
          fi
          echo "all ${#chapters[@]} chapters completed"

      - name: Upload chapter logs
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fred-chapter-logs
          path: logs/
