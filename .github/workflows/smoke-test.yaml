# Nothing checked these 22 chapter scripts before this workflow: the repository
# carries no package, no test suite and no CI, so a breaking change in dnsr or
# oasr would surface only when a reader ran the code and it failed on them.
#
# Two jobs, because the chapters divide into what can be verified cheaply and
# what has to be executed:
#
#   parse  every chapter, for syntax. Seconds, and no packages to install, so
#          the chapter excluded from the other jobs is still covered this far.
#   run    the 17 chapters that complete offline against the bundled sample
#          data and the sample pool in oasr. Roughly five minutes of compute.
#   fred   01, 03, 05 and 06, which call get_treasury_yield_data() and so need
#          a FRED API key. Separate because it depends on a secret and on a
#          live external API: without the secret it skips rather than failing,
#          and a FRED outage cannot turn the run job red. The key is read from
#          a secret into the lowercase variable dnsr expects, and is never
#          echoed -- the job tests only whether it is non-empty.
#
# One chapter is deliberately not executed:
#
#   11              trains the tidymodels/xgboost/lightgbm comparison. It ran
#                   past a ten-minute limit locally, and tune_grid() swallows
#                   the timeout per resample and exits 0 with an unfit model --
#                   so it would pass here without having checked anything.
#                   Excluding it also drops tidymodels, xgboost, lightgbm,
#                   bonsai, shapviz and ranger from every install here, which
#                   is most of the dependency weight.
name: smoke-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  parse:
    name: parse every chapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Parse all chapter scripts
        shell: Rscript {0}
        run: |
          files <- sort(list.files(".", pattern = "^[0-9]+-.*\\.R$"))
          stopifnot(length(files) > 0)
          bad <- character()
          for (f in files) {
            ok <- tryCatch({ parse(f); TRUE },
                           error = function(e) { cat(f, ":", conditionMessage(e), "\n"); FALSE })
            if (!ok) bad <- c(bad, f)
          }
          cat("parsed", length(files) - length(bad), "of", length(files), "chapters\n")
          if (length(bad)) stop("chapters that do not parse: ", paste(bad, collapse = ", "))

  run:
    name: run the offline chapters
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Chapter 20 ends by rendering create_oas_report() through pandoc. That
      # is the one step that fails on a bare machine, and the README tells
      # readers to point RSTUDIO_PANDOC at an installation; here the runner
      # supplies it.
      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # This repository is not a package, so there is no DESCRIPTION to read
      # the dependencies from. The list is the union of the library() calls in
      # the chapters this job runs; splines ships with R.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            github::ambientpointcorp/dnsr
            github::ambientpointcorp/oasr
            any::MASS
            any::PerformanceAnalytics
            any::actuar
            any::bizdays
            any::broom
            any::cmprsk
            any::digest
            any::dplyr
            any::flexsurv
            any::future
            any::future.apply
            any::ggplot2
            any::glmnet
            any::gratia
            any::lmtest
            any::mfx
            any::mgcv
            any::nnet
            any::pROC
            any::plm
            any::profvis
            any::randtoolbox
            any::readr
            any::sandwich
            any::survAUC
            any::survival
            any::survminer
            any::tidyr

      # Each chapter runs in its own process, the way a reader runs one: later
      # blocks within a chapter depend on earlier ones, but no chapter should
      # depend on another having been sourced first. Every chapter runs even
      # after one fails, so a broken dnsr or oasr release shows up as the full
      # list of affected chapters rather than just the first.
      - name: Run chapters
        run: |
          chapters=(
            02-nelson-siegel.R
            04-sde-simulation.R
            07-prepayment-foundations.R
            08-prepayment-theory.R
            09-survival-analysis.R
            10-econometric-models.R
            12-credit-model.R
            13-model-validation.R
            14-cashflow-projection.R
            15-amortization-mechanics.R
            16-settlement-conventions.R
            17-pool-aggregation.R
            18-cashflow-diagnostics.R
            19-fair-value-mc.R
            20-oas-analysis.R
            21-sensitivity.R
            22-hedging.R
          )
          mkdir -p logs
          failed=()
          echo "| chapter | result | seconds |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for f in "${chapters[@]}"; do
            echo "::group::$f"
            start=$SECONDS
            if Rscript "$f" > "logs/${f%.R}.log" 2>&1; then
              result=pass
            else
              result=FAIL
              failed+=("$f")
            fi
            dur=$(( SECONDS - start ))
            tail -40 "logs/${f%.R}.log"
            echo "::endgroup::"
            echo "$f $result ${dur}s"
            echo "| \`$f\` | $result | $dur |" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "chapters that failed: ${failed[*]}"
            exit 1
          fi
          echo "all ${#chapters[@]} chapters completed"

      - name: Upload chapter logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter-logs
          path: logs/

  fred:
    name: run the FRED chapters
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # dnsr reads this exact lowercase name, via Sys.getenv("fred_api_key"),
      # so the secret is mapped to it rather than read directly. The value is
      # only ever tested for emptiness below; nothing here prints it, dnsr
      # passes it to httr as a query parameter rather than building a URL
      # string with it, and Actions masks a registered secret in the log if it
      # ever did appear.
      fred_api_key: ${{ secrets.FRED_API_KEY }}

    steps:
      # The secrets context cannot be read in a job-level `if`, so the presence
      # of the key becomes a step output that the rest of the job keys off.
      # This skips cleanly on a repository with no secret set, rather than
      # reporting an absent key as broken chapter code.
      - name: Is a FRED key available
        id: key
        run: |
          if [ -n "$fred_api_key" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No FRED_API_KEY secret is set, so chapters 01, 03, 05 and 06 were skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'

      - uses: r-lib/actions/setup-r@v2
        if: steps.key.outputs.present == 'true'
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.key.outputs.present == 'true'
        with:
          packages: |
            github::ambientpointcorp/dnsr
            github::ambientpointcorp/oasr
            any::KFAS
            any::dplyr
            any::ggplot2
            any::purrr
            any::tibble
            any::vars
            any::yuima
            any::zoo

      - name: Run chapters
        if: steps.key.outputs.present == 'true'
        run: |
          chapters=(
            01-term-structure.R
            03-dynamic-ns.R
            05-yuima.R
            06-yield-evolution.R
          )
          mkdir -p logs
          failed=()
          echo "| chapter | result | seconds |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for f in "${chapters[@]}"; do
            echo "::group::$f"
            start=$SECONDS
            if Rscript "$f" > "logs/${f%.R}.log" 2>&1; then
              result=pass
            else
              result=FAIL
              failed+=("$f")
            fi
            dur=$(( SECONDS - start ))
            tail -40 "logs/${f%.R}.log"
            echo "::endgroup::"
            echo "$f $result ${dur}s"
            echo "| \`$f\` | $result | $dur |" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "chapters that failed: ${failed[*]}"
            exit 1
          fi
          echo "all ${#chapters[@]} chapters completed"

      - name: Upload chapter logs
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fred-chapter-logs
          path: logs/
